<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GriServer</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101418; color: #eef2f6; }
    main { width: min(680px, calc(100% - 40px)); }
    h1 { font-size: clamp(42px, 8vw, 80px); margin: 0 0 12px; letter-spacing: 0; }
    p { margin: 0; color: #aeb8c4; font-size: 18px; line-height: 1.5; }
    .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; color: #7ee787; font-size: 15px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #7ee787; box-shadow: 0 0 24px #7ee787; }
  </style>
</head>
<body>
  <main>
    <h1>GriServer</h1>
    <p>Personal AI services server. HTTPS is active and the reverse proxy is ready.</p>
    <div class="status"><span class="dot"></span><span>online</span></div>
  </main>
</body>
</html>
